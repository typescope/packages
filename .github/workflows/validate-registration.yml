name: Validate Registration PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'registry/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate registration metadata
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: origin/main
        run: python3 .github/scripts/validate_registration.py
