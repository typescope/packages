name: Validate Registration PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'registry/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate registration metadata
        env:
          BASE_REF: origin/main
        run: |
          git show origin/main:.github/scripts/validate_registration.py > /tmp/validate_registration.py
          python3 /tmp/validate_registration.py
